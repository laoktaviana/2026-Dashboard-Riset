<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAO-DashboardRiset</title>
<style>
:root{
  --ink:#0d1b2a; --paper:#f6f4ee; --line:#d8d2c4;
  --trace:#1d7874; --trace2:#e07a5f; --amber:#e6a417;
  --aur:#1d7874; --dzi:#8c5a9e; --slate:#5b6b7a;
  --ok:#2f8f5b; --run:#e6a417;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  background:var(--paper); color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.mono{font-family:"SFMono-Regular",ui-monospace,"Cascadia Mono","Roboto Mono",Menlo,monospace}

/* ---------- HERO ---------- */
header.hero{
  position:relative; overflow:hidden;
  background:var(--ink); color:var(--paper);
  border-bottom:3px solid var(--trace);
}
.hero svg.ecg{position:absolute;inset:0;width:100%;height:100%;opacity:.28}
.hero .wrap{position:relative;padding:54px 24px 46px}
.kicker{font-family:inherit;font-size:.82rem;letter-spacing:.02em;color:#a9c7c4;margin-bottom:10px}
h1.title{font-size:clamp(2rem,4.6vw,3.4rem);line-height:1.02;font-weight:600;letter-spacing:-.01em;max-width:16ch}
.subtitle{margin-top:14px;font-size:1.02rem;color:#cfd8de;max-width:52ch;line-height:1.5}
.pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--amber);margin-right:8px;box-shadow:0 0 0 0 rgba(230,164,23,.7);animation:beat 2.4s infinite}
@keyframes beat{0%{box-shadow:0 0 0 0 rgba(230,164,23,.6)}70%{box-shadow:0 0 0 12px rgba(230,164,23,0)}100%{box-shadow:0 0 0 0 rgba(230,164,23,0)}}

/* ---------- VITALS STRIP ---------- */
.vitals{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:34px}
.vital{background:var(--paper);padding:22px;display:flex;flex-direction:column;justify-content:flex-start}
.vital .num{font-size:2.6rem;line-height:1;font-weight:600;letter-spacing:-.02em;color:var(--ink);min-height:1em}
.vital .lbl{font-size:.86rem;color:var(--slate);margin-top:6px}
.vital .bar{height:3px;margin-top:12px;background:var(--line);position:relative;overflow:hidden}
.vital .bar i{position:absolute;left:0;top:0;height:100%;background:var(--trace)}
.vital.v2 .bar i{background:var(--dzi)} .vital.v3 .bar i{background:var(--run)} .vital.v4 .bar i{background:var(--ok)}

/* ---------- SECTIONS ---------- */
section{padding:52px 0 8px}
.sec-head{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:26px}
.sec-head h2{font-size:1.5rem;font-weight:600;letter-spacing:-.01em}
.sec-head .count{font-size:.9rem;color:var(--slate)} 
.sec-head .rule{flex:1}

/* ---------- FILTER ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{font-family:inherit;font-size:.9rem;padding:7px 15px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;border-radius:2px;transition:background .15s,color .15s,border-color .15s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle}

/* ---------- TOPIC LEDGER ---------- */
.ledger{display:grid;gap:0;border-top:1px solid var(--line)}
.row{
  display:grid;grid-template-columns:52px 1fr 132px;gap:18px;align-items:start;
  padding:18px 8px;border-bottom:1px solid var(--line);cursor:pointer;
  transition:background .12s;
}
.row:hover{background:#efece3}
.row .idx{font-size:1.5rem;font-weight:600;color:var(--line);line-height:1}
.row.aur .idx{color:var(--aur)} .row.dzi .idx{color:var(--dzi)}
.row .main .top{font-size:1.06rem;font-weight:600;line-height:1.3}
.row .main .meta{margin-top:7px;font-size:.85rem;color:var(--slate);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.tag{font-size:.74rem;padding:2px 9px;border-radius:2px;border:1px solid currentColor}
.tag.aur{color:var(--aur)} .tag.dzi{color:var(--dzi)}
.tag.ec{color:var(--trace2)}
.row .right{text-align:right;font-size:.8rem;color:var(--slate)}
.row .chev{transition:transform .2s;display:inline-block}
.row[aria-expanded="true"] .chev{transform:rotate(90deg)}
.detail{grid-column:1/-1;overflow:hidden;max-height:0;transition:max-height .32s ease}
.detail.open{max-height:900px}
.detail-in{padding:6px 8px 20px 70px;display:grid;grid-template-columns:1fr 1fr;gap:26px}
.detail h4{font-size:.82rem;color:var(--trace);margin-bottom:8px;font-weight:600}
.detail p{font-size:.94rem;line-height:1.55;color:#2a3744}
.detail ul{list-style:none;font-size:.9rem;line-height:1.5}
.detail ul li{padding-left:16px;position:relative;margin-bottom:3px}
.detail ul li::before{content:"›";position:absolute;left:0;color:var(--trace)}
.refs{grid-column:1/-1;margin-top:4px;padding-top:14px;border-top:1px dashed var(--line)}
.refs ol{margin-left:18px;font-size:.86rem;line-height:1.5;color:#33414d}
.refs ol li{margin-bottom:5px}
.refs .src{color:var(--slate);font-style:italic}

/* ---------- SUPERVISION ---------- */
.superv{display:grid;grid-template-columns:1fr 1fr;gap:34px}
@media(max-width:780px){.superv{grid-template-columns:1fr}}
.col-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.col-h .badge{font-size:.78rem;padding:3px 10px;border-radius:20px;color:#fff}
.badge.run{background:var(--run)} .badge.ok{background:var(--ok)}
.col-h h3{font-size:1.15rem;font-weight:600}
.stu{border-left:3px solid var(--line);padding:12px 0 12px 16px;margin-bottom:4px}
.stu.run{border-color:var(--run)} .stu.ok{border-color:var(--ok)}
.stu .nm{font-weight:600;font-size:1rem}
.stu .jd{font-size:.88rem;color:var(--slate);line-height:1.45;margin-top:3px}

/* progress ring for supervision balance */
.balance{display:flex;align-items:center;gap:20px;margin:8px 0 30px;padding:20px;background:#efece3;border:1px solid var(--line)}
.balance svg{flex:none}
.balance .txt .b1{font-size:1.6rem;font-weight:600}
.balance .txt .b2{font-size:.88rem;color:var(--slate)}

footer{margin-top:50px;border-top:1px solid var(--line);padding:26px 0 50px;color:var(--slate);font-size:.85rem}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

@media(max-width:680px){
  .vitals{grid-template-columns:repeat(2,1fr)}
  .row{grid-template-columns:38px 1fr;gap:12px}
  .row .right{display:none}
  .detail-in{grid-template-columns:1fr;padding-left:50px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.statgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:24px}
@media(max-width:680px){.statgrid{grid-template-columns:repeat(3,1fr)}}
.stat{background:var(--paper);padding:14px 12px;text-align:center}
.stat .v{font-size:1.7rem;font-weight:600;color:var(--trace);line-height:1}
.stat .k{font-size:.72rem;color:var(--slate);margin-top:5px;line-height:1.2}
.publist{border-top:1px solid var(--line)}
.pub{display:grid;grid-template-columns:64px 1fr 58px;gap:14px;align-items:start;padding:14px 6px;border-bottom:1px solid var(--line)}
.pub .yr{font-family:monospace;font-size:.9rem;color:var(--slate)}
.pub .pt{font-size:.98rem;font-weight:600;line-height:1.32}
.pub .pv{font-size:.83rem;color:var(--slate);margin-top:4px;font-style:italic}
.pub .pm{font-size:.78rem;color:var(--slate);margin-top:4px}
.qbadge{font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:3px;text-align:center;align-self:start}
.q-Q1{background:#2f8f5b;color:#fff}.q-Q2{background:#1d7874;color:#fff}.q-Conf{background:#e9e4d6;color:#5b6b7a}
@media(max-width:680px){.pub{grid-template-columns:52px 1fr;gap:10px}.pub .qbadge{grid-column:1;justify-self:start;margin-top:4px}}
.prodi-h{font-size:.82rem;font-weight:700;color:var(--trace);text-transform:uppercase;letter-spacing:.03em;margin:4px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}

.prodi-title{font-size:1.15rem;font-weight:600;color:var(--ink);padding-bottom:8px;margin-bottom:16px;border-bottom:2px solid var(--trace)}
.statusgrp{margin-bottom:22px}
.col-h h4.sh{font-size:1rem;font-weight:600}

.proditabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.ptab{font-family:inherit;font-size:.95rem;padding:9px 18px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;border-radius:3px;transition:background .15s,color .15s,border-color .15s;display:flex;align-items:center;gap:9px}
.ptab[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ptab .pcount{font-family:monospace;font-size:.82rem;opacity:.7}
#superv{display:block}
#superv > div{max-width:640px}

.pubtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pubtab{font-family:inherit;font-size:.9rem;padding:8px 15px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;border-radius:3px;transition:background .15s,color .15s,border-color .15s;display:flex;align-items:center;gap:8px}
.pubtab[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pubtab .pcount{font-family:monospace;font-size:.8rem;opacity:.7}
.prodi-sub{font-size:.9rem;font-weight:700;color:var(--trace);text-transform:uppercase;letter-spacing:.03em;margin:2px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.statustabs .ptab{font-size:.85rem;padding:6px 13px}
.statustabs{margin-top:-8px}
.plink{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--trace);transition:color .15s}
.plink:hover{color:var(--trace)}
</style>
</head>

/* ---- refs matcher ---- */
function refsFor(topik){
  // match a refs group by shared tokens with the group key
  const toks=t=>new Set((t||'').toLowerCase().replace(/[(),\-\/]/g,' ').split(/\s+/).filter(w=>w.length>3));
  const tt=toks(topik); let best=null,bs=0;
  for(const k in DATA.refs){
    const kt=toks(k); let s=0; kt.forEach(w=>{if(tt.has(w))s++});
    if(s>bs){bs=s;best=k}
  }
  return best?DATA.refs[best]:[];
}

    const row=document.createElement('div');

function rebuildSupervision(){

  }},
  tel:{label:'S1 Teknik Telekomunikasi', status:{

  }},
};
let curProdi='bme', curStatus='run';

function renderStatusTabs(){
  const st=MODEL[curProdi].status;
  statusTabsEl.innerHTML='';
  const keys=Object.keys(st).filter(k=>st[k].n>0);
  if(!keys.includes(curStatus)) curStatus=keys[0];
  keys.forEach(k=>{
    const b=document.createElement('button');
    b.className='ptab'; b.dataset.k=k; b.setAttribute('aria-pressed', k===curStatus);
    b.innerHTML=`${st[k].label} <span class="pcount">${st[k].n}</span>`;
    b.onclick=()=>{curStatus=k; renderStatusTabs(); renderPanel();};
    statusTabsEl.appendChild(b);
  });
}
function renderPanel(){
  const s=MODEL[curProdi].status[curStatus];
  sup.innerHTML=`<div>${s.html||'<p style="color:var(--slate);font-size:.9rem">Belum ada data.</p>'}</div>`;
}
function renderProdiTabs(){
  prodiTabsEl.innerHTML='';
  Object.keys(MODEL).forEach(k=>{
    const total=Object.values(MODEL[k].status).reduce((a,x)=>a+x.n,0);
    const b=document.createElement('button');
    b.className='ptab'; b.dataset.k=k; b.setAttribute('aria-pressed', k===curProdi);

    b.onclick=()=>{curProdi=k; renderProdiTabs(); renderStatusTabs(); renderPanel();};

}

function renderPublikasi(){
  const s=SINTA.stats||{};
  const pubs=SINTA.pubs||[];
  const pc=document.getElementById('pubcount');
  if(pc) pc.textContent=`${pubs.length} publikasi`+(s.score?` · SINTA Score ${s.score}`:'');

    const cards=[['score','SINTA Score'],['score3','Score 3 Thn'],['hindex','H-Index'],['gindex','G-Index'],['artScopus','Artikel Scopus'],['cit','Sitasi']];
    sg.innerHTML=cards.filter(c=>s[c[0]]!==undefined).map(c=>`<div class="stat"><div class="v">${s[c[0]]}</div><div class="k">${c[1]}</div></div>`).join('')

  }
  const listEl=document.getElementById('publist');

    <div class="pub">

      <div class="qbadge q-${p.q||'Conf'}">${p.q||'Conf'}</div>
    </div>`;}
  const catDefs=[
    {key:'all',label:'Semua'},
    {key:'jurnal',label:'Jurnal Internasional'},
    {key:'proc',label:'Proceeding Conference'},
  ];
  function showCat(k){
    const rows=pubs.filter(p=>k==='all'||p.cat===k);
    listEl.innerHTML=rows.length?rows.map(pubRow).join(''):'<p style="color:var(--slate);font-size:.9rem;padding:14px 0">Belum ada data publikasi.</p>';
    [...tabsEl.children].forEach(b=>b.setAttribute('aria-pressed', b.dataset.k===k));
  }
  tabsEl.innerHTML='';
  catDefs.forEach((c,idx)=>{
    const n=c.key==='all'?pubs.length:pubs.filter(p=>p.cat===c.key).length;
    if(c.key!=='all' && n===0) return;
    const b=document.createElement('button');
    b.className='pubtab'; b.dataset.k=c.key; b.setAttribute('aria-pressed', idx===0);
    b.innerHTML=`${c.label} <span class="pcount">${n}</span>`;
    b.onclick=()=>showCat(c.key);
    tabsEl.appendChild(b);
  });
  showCat('all');

  const stamp=document.getElementById('sintastamp');
  if(stamp && SINTA.updated) stamp.textContent='Data SINTA diperbarui: '+SINTA.updated;
}
